services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /app/data/ams.db   # SQLite лежит в томе и переживает перезапуск
      PLANNER: mock               # детерминированный demo-режим, платные API не нужны
    volumes:
      - ams-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  ams-data: {}
